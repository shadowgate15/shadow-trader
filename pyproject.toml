[project]
name = "shadow-trader"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Taylor Schley", email = "taylorschley@me.com" }
]
requires-python = ">=3.13"
dependencies = [
    "polars>=2",
    "pyarrow>=26.0.0",
    "rich>=15.0.0",
]

[project.scripts]
shadow-trader = "shadow_trader:main"

[build-system]
requires = ["uv_build>=0.13.0,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "hypothesis>=6.169.0",
    "pytest>=9.1.1",
    "ruff>=0.17.0",
    "ty>=0.0.86",
]
oracle = [
    "numpy>=2.5.4",
    "ta-lib>=0.8.2",
]

[tool.ruff]
line-length = 88
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]

[tool.ty.environment]
python-version = "3.13"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-m 'not slow'"
markers = [
    "slow: full-month runs against the real raw cache; opt in with -m slow",
    "oracle: needs the optional TA-Lib dev group; skipped when absent",
]
