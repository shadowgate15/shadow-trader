[project]
name = "shadow-trader"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Taylor Schley", email = "taylorschley@me.com" }
]
requires-python = ">=3.13"
dependencies = [
    "gymnasium>=1.4.0",
    "pyarrow>=26.0.0",
    "stable-baselines3>=2.9.2",
]

[project.scripts]
shadow-trader = "shadow_trader:main"

[build-system]
requires = ["uv_build>=0.13.0,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.17.0",
    "ty>=0.0.86",
]

[tool.ruff]
line-length = 88
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]

[tool.ty.environment]
python-version = "3.13"
